aid: esusu
name: Esusu
description: 'Esusu is a financial technology company that turns rent payments into
  credit history. Founded in 2018 by Abbey Wemimo and Samir Goel and headquartered
  in New York City, Esusu reports on-time rental payments to the three major credit
  bureaus (Equifax, TransUnion, and Experian) so renters can build and improve their
  credit scores. The platform serves renters, property owners and managers, employers,
  banks, and fintechs with rent reporting, credit building, rent relief, marketplace
  rewards, and income, identity, and SSN verification. For partners, Esusu offers embedded
  rent-reporting APIs, UI tools, and SDKs (behind a sandbox and self-service docs)
  so banks and fintechs can distribute rent reporting as a service. Backed by SoftBank
  Vision Fund 2 and Serena Ventures, Esusu reached a $1.2 billion valuation in 2025
  and reports across millions of rental units in all 50 US states.'
